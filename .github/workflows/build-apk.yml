name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.kovexor.buildasimplecalculatorwith6paw","appName":"Build a simple calculator with","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - name: Generate Android app icon
        continue-on-error: true
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-a-simple-calculator-with.apk"
          gh release create "build-${{ github.run_number }}" "build-a-simple-calculator-with.apk" --title "APK build ${{ github.run_number }}" --notes "Built with Kovexor"
